[workspace]
members = [".", "mobile/native", "crates/notmux-core", "crates/notmux-git", "crates/notmux-views-git", "crates/notmux-views-services", "crates/notmux-views-sidebar", "crates/notmux-views-terminal", "crates/notmux-terminal", "crates/notmux-layout", "crates/notmux-state", "crates/notmux-hooks", "crates/notmux-workspace", "crates/notmux-ui", "crates/notmux-files", "crates/notmux-markdown", "crates/notmux-extensions", "crates/notmux-ext-claude", "crates/notmux-ext-codex", "crates/notmux-ext-updater", "crates/notmux-services", "crates/notmux-remote-client", "crates/notmux-views-remote", "crates/notmux-theme", "crates/notagent-theme"]
resolver = "2"

[package]
name = "notmux"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "notmux"
path = "src/main.rs"

[dependencies]
# Shared core types
notmux-core = { path = "crates/notmux-core", features = ["client"] }
notmux-git = { path = "crates/notmux-git" }
notmux-views-git = { path = "crates/notmux-views-git" }
notmux-views-terminal = { path = "crates/notmux-views-terminal" }
notmux-terminal = { path = "crates/notmux-terminal" }
notmux-services = { path = "crates/notmux-services" }
notmux-views-services = { path = "crates/notmux-views-services" }
notmux-views-sidebar = { path = "crates/notmux-views-sidebar" }
notmux-remote-client = { path = "crates/notmux-remote-client" }
notmux-views-remote = { path = "crates/notmux-views-remote" }
notmux-workspace = { path = "crates/notmux-workspace" }
notmux-ui = { path = "crates/notmux-ui" }
notmux-theme = { path = "crates/notmux-theme" }
notmux-files = { path = "crates/notmux-files" }
notmux-markdown = { path = "crates/notmux-markdown" }
notmux-hooks = { path = "crates/notmux-hooks" }

# Extension system
notmux-extensions = { path = "crates/notmux-extensions" }
notmux-ext-claude = { path = "crates/notmux-ext-claude" }
notmux-ext-codex = { path = "crates/notmux-ext-codex" }
notmux-ext-updater = { path = "crates/notmux-ext-updater" }

# UI Framework (from Zed repo)
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }

# UI Components
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }

# Terminal Emulation
alacritty_terminal = "0.25"

# PTY Management
portable-pty = "0.9"

# Async Runtime
smol = "2.0"
async-channel = "2.3"
parking_lot = "0.12"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# System info
sysinfo = "0.33"
libc = "0.2"

# Utilities
uuid = { version = "1.10", features = ["v4"] }
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"
regex = "1.10"

# Asset embedding
rust-embed = "8.5"

# Time handling (cross-platform, thread-safe)
time = { version = "0.3", features = ["local-offset"] }

# Syntax highlighting
syntect = { version = "5", features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# Markdown parsing
pulldown-cmark = "0.12"

# Self-updater
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
semver = "1"

# Remote control server
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
axum = { version = "0.8", features = ["ws"] }

base64 = "0.22"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
data-encoding = "2.6"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", features = ["test-support"] }

# Pin core-text to 21.0.x to avoid core-graphics 0.24/0.25 conflict in zed-font-kit
[target.'cfg(target_os = "macos")'.dependencies]
core-text = ">=21.0, <21.1"
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
