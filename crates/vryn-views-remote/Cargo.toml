[package]
name = "vryn-views-remote"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
vryn-core = { path = "../vryn-core", features = ["client"] }
vryn-remote-client = { path = "../vryn-remote-client" }
vryn-ui = { path = "../vryn-ui" }

gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1.10", features = ["v4"] }
log = "0.4"
