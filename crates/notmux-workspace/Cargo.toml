[package]
name = "notmux-workspace"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
notmux-core = { path = "../notmux-core", features = ["client"] }
notmux-terminal = { path = "../notmux-terminal" }
notmux-git = { path = "../notmux-git" }
notmux-layout = { path = "../notmux-layout" }
notmux-state = { path = "../notmux-state" }
notmux-hooks = { path = "../notmux-hooks" }
notmux-theme = { path = "../notmux-theme" }

gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
uuid = { version = "1.10", features = ["v4"] }
log = "0.4"
tokio = { version = "1", features = ["sync"] }
dirs = "5.0"
anyhow = "1.0"
smol = "2.0"
libc = "0.2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", features = ["test-support"] }
