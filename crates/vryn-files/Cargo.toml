[package]
name = "vryn-files"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
vryn-core = { path = "../vryn-core", features = ["blocking-http"] }
vryn-markdown = { path = "../vryn-markdown" }
vryn-ui = { path = "../vryn-ui" }

gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }

syntect = { version = "5", features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
