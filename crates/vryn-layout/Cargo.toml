[package]
name = "vryn-layout"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
vryn-core = { path = "../vryn-core", features = ["client"] }
vryn-terminal = { path = "../vryn-terminal" }

serde = { version = "1.0", features = ["derive"] }
log = "0.4"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
