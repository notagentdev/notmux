[package]
name = "notmux-views-git"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
notmux-core = { path = "../notmux-core", features = ["blocking-http"] }
notmux-extensions = { path = "../notmux-extensions" }
notmux-git = { path = "../notmux-git" }
notmux-files = { path = "../notmux-files" }
notmux-ui = { path = "../notmux-ui" }
notmux-workspace = { path = "../notmux-workspace" }

gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }

syntect = { version = "5", features = ["default-fancy"] }
smol = "2.0"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6"
notify-debouncer-mini = "0.4"
async-channel = "2"
time = { version = "0.3", features = ["local-offset"] }
