name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libegl1-mesa-dev libssl-dev libfontconfig-dev libwebkit2gtk-4.1-dev \
            libxdo-dev pkg-config cmake
      - uses: oven-sh/setup-bun@v2
      - name: Build web client
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Test installer guardrails (offline)
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check compilation
        run: cargo check --locked --release
      - name: Run tests
        run: cargo test --locked

  # macOS is signed and notarized on the release Mac, not on hosted runners.
  # Mobile releases are disabled until the companion app is ready.
  build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: notmux-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: notmux-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          test "${GITHUB_REF#refs/tags/v}" = "$VERSION"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libegl1-mesa-dev libssl-dev libfontconfig-dev libwebkit2gtk-4.1-dev \
            libxdo-dev pkg-config cmake
      - uses: oven-sh/setup-bun@v2
      - name: Build web client
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/icons
          cp target/${{ matrix.target }}/release/notmux dist/
          chmod +x dist/notmux
          cp assets/app-icon-16.png assets/app-icon-32.png assets/app-icon-48.png \
             assets/app-icon-64.png assets/app-icon-128.png assets/app-icon-256.png \
             assets/app-icon-512.png dist/icons/
          cp notmux.desktop LICENSE dist/
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/notmux.exe LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 7

  # Never publish automatically: add locally notarized macOS assets first.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          tar -czf notmux-linux-x64.tar.gz -C artifacts/notmux-linux-x64 .
          (cd artifacts/notmux-windows-x64 && zip -r ../../notmux-windows-x64.zip .)
          sha256sum notmux-linux-x64.tar.gz notmux-windows-x64.zip > SHA256SUMS
      - name: Extract release notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk -v v="$VERSION" '
            $0 == "## [" v "]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [[ ! -s RELEASE_BODY.md ]]; then
            printf 'Release v%s.\n' "$VERSION" > RELEASE_BODY.md
          fi
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            notmux-linux-x64.tar.gz
            notmux-windows-x64.zip
            SHA256SUMS
          body_path: RELEASE_BODY.md
          generate_release_notes: false
